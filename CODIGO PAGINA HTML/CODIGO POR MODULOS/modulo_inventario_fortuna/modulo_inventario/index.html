<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo de Inventario — Dotaciones Fortuna IJ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Panel Lateral -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <img src="assets/image-2.png" alt="Logo">
                <span>Fortuna IJ</span>
            </div>
            <nav class="nav-menu">
                <a href="#" class="nav-link active">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8l-7 5V8l-7 5V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/></svg>
                    Inventario
                </a>
            </nav>
        </aside>

        <!-- Contenido Principal -->
        <main class="main-content">
            <header class="top-bar">
                <h1>Gestión de Inventario</h1>
                <div class="user-info">
                    <span>Admin Inventario</span>
                </div>
            </header>

            <div class="module-container">
                <!-- Modulo Encabezado -->
                <div class="module-header">
                    <div class="header-info">
                        <div class="icon-box">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8l-7 5V8l-7 5V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/></svg>
                        </div>
                        <div>
                            <h2>Control de Existencias</h2>
                            <p id="inv-subtitle">Cargando datos...</p>
                        </div>
                    </div>
                    <button class="btn btn-secondary" onclick="exportCSV()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        Exportar CSV
                    </button>
                </div>

                <!-- Indicador Clave -->
                <div class="kpi-grid" id="kpi-container">
                    <!-- Se llena con JS -->
                </div>

                <!-- Filtros y Búsqueda -->
                <div class="controls-row">
                    <div class="search-box">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        <input type="text" id="search-input" placeholder="Buscar por nombre..." oninput="renderTable()">
                    </div>
                    <select id="cat-filter" onchange="renderTable()">
                        <option value="all">Todas las categorías</option>
                    </select>
                    <select id="status-filter" onchange="renderTable()">
                        <option value="all">Todos los estados</option>
                        <option value="Normal">Normal</option>
                        <option value="Bajo Stock">Bajo Stock</option>
                        <option value="Sin Stock">Sin Stock</option>
                    </select>
                </div>

                <!-- Tabla de Inventario -->
                <div class="table-wrapper">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th onclick="sortData('nombre')">Producto ↕</th>
                                <th>Categoría</th>
                                <th onclick="sortData('stock')">Stock ↕</th>
                                <th>Nivel</th>
                                <th>Estado</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody id="table-body">
                            <!-- Se llena con JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal de Ajuste -->
    <div class="modal-overlay" id="modal-ajuste" style="display: none;">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title">Ajustar Stock</h3>
                <button onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Tipo de Movimiento</label>
                    <select id="ajuste-tipo">
                        <option value="entrada">Entrada (+)</option>
                        <option value="salida">Salida (-)</option>
                        <option value="set">Ajuste Manual</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Cantidad</label>
                    <input type="number" id="ajuste-qty" min="1" placeholder="0">
                </div>
                <div class="form-group">
                    <label>Motivo</label>
                    <input type="text" id="ajuste-motivo" placeholder="Ej: Compra a proveedor">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="applyAjuste()">Guardar Cambios</button>
            </div>
        </div>
    </div>

    <script src="inventory.js"></script>
</body>
</html>
